<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a30" />
    <title>Open Weather</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <!-- App styles -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="weather-app">
      <div class="container-fluid px-0">
        <div class="row g-0" id="row">
          <!-- ===== Left / Branding ===== -->
          <div class="col-12 col-lg-6" id="left">
            <div class="pane-inner text-center">
              <img
                src="./logo_white_cropped.png"
                alt="Open Weather"
                id="branding"
              />
              <h1 class="brand-title">Open Weather API</h1>
              <p class="brand-sub">
                Enter Your City. Check Your Weather Instantly.
              </p>
            </div>
          </div>

          <!-- ===== Right / Weather ===== -->
          <div class="col-12 col-lg-6" id="right">
            <div class="pane-inner">
              <div class="weather-card text-center">
                <img
                  src="https://openweathermap.org/img/w/03d.png"
                  alt="Scattered Cloud"
                  id="condition"
                />

                <p class="location">
                  <span id="city">Dhaka</span><span class="sep">,</span
                  ><span id="country">BD</span>
                </p>

                <div class="temp-row">
                  <span id="temp">32</span>
                </div>

                <p class="condition-text">
                  <strong><span id="main">Cloud</span></strong>
                  <span class="desc">(<span id="description">Scattered Cloud</span>)</span>
                </p>

                <div class="stats">
                  <div class="stat">
                    <span class="stat-value"><span id="pressure">1032</span></span>
                    <span class="stat-label">Pressure</span>
                  </div>
                  <div class="stat">
                    <span class="stat-value"><span id="humidity">75</span></span>
                    <span class="stat-label">Humidity</span>
                  </div>
                </div>

                <div class="search-box">
                  <span class="search-icon" aria-hidden="true">&#128269;</span>
                  <input
                    type="text"
                    id="city-input"
                    placeholder="Enter your City name"
                    class="form-control"
                    aria-label="City name"
                    autocomplete="off"
                  />
                </div>

                <small class="form-text">
                  After entering a valid city name, press Enter to get the
                  result.
                </small>

                <div id="history"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="script2.js"></script>
  </body>
</html>
